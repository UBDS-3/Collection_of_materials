[project]
name = "collection-of-materials"
version = "0.1.0"
description = "Python environment for rendering the Quarto teaching-materials website"
requires-python = ">=3.10,<3.13"
dependencies = [
  # NumPy 1.x avoids ABI failures with extensions compiled before NumPy 2.
  "numpy>=1.26,<2",
  "matplotlib>=3.8,<4",

  # Quarto uses Jupyter and nbclient to execute and render .ipynb/Python cells.
  "jupyter>=1.0,<2",
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<1",

  # Common data-frame support, including Quarto's ojs_define conversion path.
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
]

[tool.uv]
package = false
