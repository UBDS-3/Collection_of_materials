project:
  type: website
  output-dir: _site
  # Folder globs discover every supported source recursively while avoiding
  # project documentation such as README.md and SITE_CUSTOMIZATION.md.
  render:
    - index.qmd
    - "content/**/*.qmd"
    - "content/**/*.Rmd"
    - "content/**/*.rmd"
    - "content/**/*.ipynb"
    - "generated-pages/**/*.qmd"
    - "generated-live/**/*.qmd"
  # Static documents are copied unchanged and displayed through generated QMD
  # wrapper pages. Do not edit generated-pages/ by hand.
  resources:
    - "assets/site/**"
    - "content/**/*.html"
    - "content/**/*.pdf"
    - "content/**/*.pptx"
    - "content/**/*.R"
    - "content/**/*_files/**"
    # Archived course sites are linked from overview pages, but their
    # underscore-prefixed folders are not added as hundreds of navbar items.
    - "content/**/_course-material/**"
    # Small datasets stored beside teaching material are published unchanged.
    # See DATASETS.md for the supported layout and browser-loading examples.
    - "content/**/data/**"
    # Data files kept beside the Python notebooks (rather than in data/).
    - "content/python-basic/**/*.csv"
    - "content/python-basic/**/*.tsv"
    - "content/python-basic/**/*.gff"
    - "content/python-basic/**/*.fasta"
    - "content/python-basic/**/*.py"
    # Small tabular inputs used by advanced lessons. The large MRI image tree
    # and macOS metadata files are intentionally not copied as blanket resources.
    - "content/advanced/Neural Networks/1-perceptron/sleep_disorder_data.csv"
    - "content/advanced/Neural Networks/2-neural-networks/breast-cancer.csv"
    - "content/advanced/Neural Networks/2-neural-networks/heart.csv"
    - "datasets/**"

