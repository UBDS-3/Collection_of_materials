project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - materials/quarto-example.qmd
    - materials/rmarkdown-example.Rmd
    - materials/notebook-example.ipynb
    - materials/live-code.qmd
    - slides/course-slides.qmd

website:
  title: "Collection of materials"
  repo-url: https://github.com/UBDS-3/Collection_of_materials
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Materials
        menu:
          - href: materials/quarto-example.qmd
            text: Quarto example
          - href: materials/rmarkdown-example.Rmd
            text: R Markdown example
          - href: materials/notebook-example.ipynb
            text: Jupyter example
          - href: materials/live-code.qmd
            text: Run code in browser
      - href: slides/course-slides.html
        text: Slides
    right:
      - icon: github
        href: https://github.com/UBDS-3/Collection_of_materials
        aria-label: GitHub
  page-footer:
    left: "Built with Quarto and GitHub Pages"

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-fold: show

execute:
  enabled: true
