project:
  type: website
  output-dir: _site
  # Folder globs discover every supported source recursively while avoiding
  # project documentation such as README.md and SITE_CUSTOMIZATION.md.
  render:
    - index.qmd
    - "content/**/*.qmd"
    - "content/**/*.Rmd"
    - "content/**/*.rmd"
    - "content/**/*.ipynb"
    - "generated-pages/**/*.qmd"
    - "generated-live/**/*.qmd"
  # Static documents are copied unchanged and displayed through generated QMD
  # wrapper pages. Do not edit generated-pages/ by hand.
  resources:
    - "content/**/*.html"
    - "content/**/*.pdf"
    - "content/**/*.pptx"
    - "content/**/*_files/**"

website:
  title: "Collection of materials"
  repo-url: https://github.com/UBDS-3/Collection_of_materials
  repo-actions: [edit, issue]

  # SITE NAVIGATION
  # Do not edit the generated block by hand. Configure it in
  # site-navigation.toml, then run scripts/generate-navigation.py.
  navbar:
    pinned: true
    search: true
    left:
      # BEGIN AUTO-GENERATED NAVIGATION
      - href: "index.qmd"
        text: "Home"
      - text: "R basics"
        menu:
          - href: "generated-live/content/r-basic/rmarkdown-example.qmd"
            text: "R Markdown example"
          - href: "generated-pages/content/r-basic/tidy-data-html.qmd"
            text: "Tidy Data (HTML)"
      - text: "Python basics"
        menu:
          - href: "generated-live/content/python-basic/notebook-example.qmd"
            text: "Jupyter notebook example"
          - href: "generated-live/content/python-basic/quarto-example.qmd"
            text: "Quarto example"
      - text: "Advanced"
        menu:
          - href: "content/advanced/live-code.qmd"
            text: "Run code in your browser"
      - text: "Lectures"
        menu:
          - href: "generated-pages/content/lectures/slides-pdf.qmd"
            text: "BashLand Course (PDF)"
          - href: "content/lectures/course-slides.qmd"
            text: "Example course slides"
          - href: "generated-pages/content/lectures/260713-BDS3_intro_to_modern_bio_data_Helena_Crowell-pdf.qmd"
            text: "Introduction to Modern Biological Data — Helena Crowell (PDF)"
      - text: "Research highlights"
        menu:
          - href: "content/research-highlights/index.qmd"
            text: "Research highlights overview"
      - text: "Post-school materials"
        menu:
          - href: "content/post-school-materials/index.qmd"
            text: "Post-school materials overview"
      # END AUTO-GENERATED NAVIGATION
    right:
      - icon: github
        href: https://github.com/UBDS-3/Collection_of_materials
        aria-label: GitHub
  page-footer:
    left: "Built with Quarto and GitHub Pages"
    right: "Navigation generated from content folders"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-fold: show

execute:
  enabled: true
